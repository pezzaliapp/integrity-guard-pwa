<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Integrity Guard – PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f0c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0f0c;
      color: #e6f2ea;
    }
    main {
      max-width: 900px;
      margin: auto;
      padding: 32px;
    }
    h1 {
      margin-top: 0;
      color: #9fe3c3;
    }
    input, button, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 16px;
      font-size: 16px;
    }
    button {
      background: #1e2f27;
      color: #e6f2ea;
      border: 1px solid #3a5c4b;
      cursor: pointer;
    }
    button:hover {
      background: #264036;
    }
    .note {
      background: #111916;
      border-left: 4px solid #3a5c4b;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      border-bottom: 1px solid #2a3f35;
      padding: 8px;
      text-align: left;
      font-size: 14px;
    }
    .warn {
      color: #f5c16c;
    }
    .ok {
      color: #9fe3c3;
    }
    .err {
      color: #ff8a8a;
    }
  </style>
</head>
<body>
<main>
  <h1>Integrity Guard – PWA</h1>

  <p>
    Verifica <strong>SHA-256</strong> degli asset pubblicati su un URL base.<br>
    <strong>Modalità definitiva:</strong> hash-only (come ieri sera).
  </p>

  <div class="note">
    ✅ Nessuna firma richiesta<br>
    ✅ Nessun blocco se manca integrity.sig<br>
    ⚠️ La firma crittografica è fuori scope (Trusting Trust reale ≠ browser)
  </div>

  <label>URL base (finire con /)</label>
  <input id="baseUrl" value="https://www.alessandropezzali.it/trusting-trust-pwa/" />

  <button onclick="verify()">Verifica</button>

  <div id="status"></div>

  <table id="results" hidden>
    <thead>
      <tr>
        <th>File</th>
        <th>SHA-256 reale</th>
        <th>Esito</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script src="app.js"></script>
</body>
</html>
